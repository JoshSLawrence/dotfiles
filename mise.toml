# Dev tools and tasks for working on this repo. Lives at the repo root, outside
# home/, so chezmoi never manages it. Run `mise trust` once, then
# `mise run lint` and `mise run test`.
[tools]
chezmoi = "2.73.0"
shellcheck = "0.11.0"
# markdownlint-cli2 is an npm package, so it needs node.
node = "24.21.0"
"npm:markdownlint-cli2" = "0.23.3"
actionlint = "1.7.12"

[tasks.lint]
description = "Run every linter"
depends = ["lint:shell", "lint:scripts", "lint:markdown", "lint:workflow"]

[tasks."lint:workflow"]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks.test]
description = "Run every test"
depends = ["test:apply"]
