[settings]
minimum_release_age = "24h"
minimum_release_age_excludes = ["claude", "opencode"]
auto_update = true

# mise asks gh for a GitHub token, so API calls are authenticated without a
# token in an environment variable. Global-only: mise ignores it in projects.
[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'

[tools]
chezmoi = "latest"
node = "26.4.0"
opentofu = "latest"
terraform = "latest"
kubectl = "1.37.0"
go = "latest"
terraform-docs = "latest"
trivy = "latest"
cookiecutter = "latest"
pre-commit = "latest"
tflint = "latest"
pipx = "latest"
github-cli = "latest"
neovim = "latest"
lazygit = "latest"
kubecolor = "latest"
krew = "latest"
k9s = "latest"
opencode = "latest"
helm = "latest"
oh-my-posh = "latest"
fzf = "latest"
azure-cli = "latest"
powershell = "latest"
zoxide = "latest"
cowsay = "latest"
arduino-cli = "latest"
kind = "latest"
argocd = "latest"
spacectl = "latest"
aws = { version = "latest", symlink_bins = "true" }
btop =  { version = "latest", os = ["linux", ] }
lazydocker = "latest"
tree-sitter = "latest"
sqlc = "latest"
yazi = "latest"
fd = "latest" # required for nvim plugin: snacks (explorer search)
fastfetch = "latest"
usage = "latest"
bat = "latest"
