[settings]
minimum_release_age = "24h"
minimum_release_age_excludes = ["claude", "aqua:anomalyco/opencode"]
self_update.auto = true
# Lock only the platforms this config runs on: mise.lock otherwise covers
# seven, and installs on any other platform add entries to it.
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

# mise asks gh for a GitHub token, so API calls are authenticated without a
# token in an environment variable. Global-only: mise ignores it in projects.
[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'

# mise.lock pins the exact version of every tool, "latest" included, so all
# machines run the same versions. `mise upgrade` moves them; commit the lock.
# Prefixes mark the tools whose version line matters.
[tools]
chezmoi = "latest"
node = "26"
opentofu = "latest"
terraform = "latest"
kubectl = "1.37"
go = "latest"
terraform-docs = "latest"
trivy = "latest"
cookiecutter = "latest"
# The pypi build runs everywhere; the aqua one has no Windows release.
"pypi:pre-commit" = "latest"
tflint = "latest"
pipx = { version = "latest", os = ["linux", "macos"] }
github-cli = "latest"
neovim = "latest"
lazygit = "latest"
kubecolor = "latest"
krew = "latest"
k9s = "latest"
# mise's registry maps `opencode` to npm first; aqua installs the release
# binary directly, with no node or postinstall build.
"aqua:anomalyco/opencode" = "latest"
helm = "latest"
oh-my-posh = "latest"
fzf = "latest"
# azure-cli depends on prerelease packages, which uv skips unless allowed.
# `az extension add` runs `python -m pip`, and mise's uv venv has no pip
# unless `with` adds it. The postinstall adds or upgrades the Azure DevOps
# extension, which lives in ~/.azure/cliextensions and so outlasts upgrades.
azure-cli = { version = "latest", dependency_prereleases = "allow", with = ["pip"], postinstall = "az extension add --name azure-devops --upgrade --yes" }
powershell = "latest"
zoxide = "latest"
cowsay = "latest"
"npm:gitignore" = "latest"
# SOQL language server for nvim. The package has no bin; nvim runs its
# lib/server.js with node (see lua/plugins/lsp-config.lua in the nvim repo).
"npm:@salesforce/soql-language-server" = "latest"
arduino-cli = "latest"
kind = "latest"
argocd = "latest"
spacectl = "latest"
# No Windows release through mise: install the AWS CLI MSI there.
aws = { version = "latest", symlink_bins = "true", os = ["linux", "macos"] }
btop = { version = "latest", os = ["linux"] }
lazydocker = "latest"
tree-sitter = "latest"
sqlc = "latest"
yazi = "latest"
fd = "latest" # required for nvim plugin: snacks (explorer search)
fastfetch = "latest"
usage = "latest"
bat = "latest"
# No ARM Linux release.
kiota = { version = "latest", os = ["linux/x64", "macos", "windows"] }
claude = "latest"
pnpm = "latest"
shellcheck = "latest"
azure-kubelogin = "latest"
dotnet = "latest"
herdr = "latest"
conftest = "latest"
pi = "latest"
crictl = "latest"
minikube = "latest"
python = "3.14"
uv = "latest"
k3d = "latest"
cheat = "latest"
copilot = "latest"
codex = "latest"
"aqua:pressly/goose" = "latest"
postgres = "latest"

# Global tasks run from any directory. A project task with the same name
# would hide this one, hence the prefix.
[tasks."mise:upgrade"]
description = "Update mise, upgrade the global tools and refresh mise.lock"
run = [
  "mise self-update --yes",
  # Moves "latest" and ranges to their newest release, installs it, and
  # writes the new versions to mise.lock. Project config is left alone.
  "mise upgrade --global",
  # Fills in checksums and URLs for the other lockfile_platforms.
  "mise lock --global",
]
